[project]
name = "local-worker-mcp"
version = "0.1.0"
description = "MCP local agnóstico de cliente: frontier planeja e revisa; Gemma/Ollama executa o trabalho pesado."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CaioAllgayer" }]
keywords = ["mcp", "ollama", "gemma", "local-llm", "delegation", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/CaioAllgayer/Local-Worker-MCP"
Issues = "https://github.com/CaioAllgayer/Local-Worker-MCP/issues"

[project.scripts]
local-worker-mcp = "local_worker.cli:main"
local-worker = "local_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable local LLM endpoint",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
